<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WPBrigade Chatbot — Sign In</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="logo-mark">WB</div>
    <h1>WPBrigade Chatbot</h1>
    <p class="subtitle">Sign in with your admin email to manage users.</p>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="login-form">
      <input type="email" name="email" placeholder="admin@example.com" required autofocus>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
